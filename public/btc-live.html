<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PredictX - BTC 5MIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #0a0a0a; color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    .btn-up { background: #22c55e; }
    .btn-up:hover { background: #16a34a; }
    .btn-down { background: #ef4444; }
    .btn-down:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div style="max-width: 600px; margin: 0 auto; padding: 16px;">
    
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div>
        <div style="font-size: 14px; color: #94a3b8;">Crypto • 5MIN</div>
        <div style="font-size: 24px; font-weight: bold;" id="titlePrice">BTC $0</div>
        <div style="font-size: 12px; color: #fbbf24;" id="cycleLabel">05:00 remaining</div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 28px; font-weight: bold; color: #22c55e;" id="countdown">00:00</div>
        <div style="font-size: 12px; color: #94a3b8;">Balance: <span id="balance" style="color: white;">$10,000</span></div>
      </div>
    </div>

    <!-- Price Change -->
    <div style="text-align: center; margin-bottom: 16px;">
      <span id="priceChange" style="font-size: 24px; font-weight: bold;">0.00%</span>
      <span style="font-size: 14px; color: #94a3b8;"> from beat</span>
    </div>

    <!-- Chart (embedded, taller with beat line) -->
    <div style="background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 16px; height: 450px;">
      <canvas id="chart" style="height: 400px !important;"></canvas>
      <div id="chartPrice" style="text-align: center; color: #22c55e; font-size: 20px; font-weight: bold; margin-top: 8px;">Loading...</div>
    </div>

    <!-- Beat Price -->
    <div style="text-align: center; margin-bottom: 16px;">
      <span style="color: #94a3b8;">Beat: </span>
      <span id="strike" style="font-weight: bold;">$0</span>
    </div>

    <!-- Bet Amount -->
    <div style="margin-bottom: 16px;">
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="number" id="betAmount" value="100" style="flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: white; font-size: 18px; text-align: center;">
        <button onclick="addBet(10)" style="background: #334155; border: none; border-radius: 8px; padding: 12px 16px; color: white; cursor: pointer;">+10</button>
        <button onclick="addBet(50)" style="background: #334155; border: none; border-radius: 8px; padding: 12px 16px; color: white; cursor: pointer;">+50</button>
        <button onclick="addBet(100)" style="background: #334155; border: none; border-radius: 8px; padding: 12px 16px; color: white; cursor: pointer;">+100</button>
      </div>
    </div>

    <!-- Trading Buttons -->
    <div style="display: flex; gap: 12px;">
      <button onclick="placeBet('UP')" class="btn-up" style="flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; color: white; cursor: pointer;">UP</button>
      <button onclick="placeBet('DOWN')" class="btn-down" style="flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; color: white; cursor: pointer;">DOWN</button>
    </div>

    <!-- Message -->
    <div id="message" style="text-align: center; margin-top: 16px; color: #94a3b8; font-size: 14px;"></div>

  </div>

  <script>
    // Chart setup
    var prices = [];
    var chart;
    var maxPoints = 150;
    var beatPrice = 0;

    // Chart plugin for beat line
    var beatLinePlugin = {
      id: 'beatLine',
      afterDatasetsDraw: function(chart) {
        if (!beatPrice || beatPrice === 0) return;
        
        var ctx = chart.ctx;
        var y = chart.scales.y.getPixelForValue(beatPrice);
        
        // Draw line
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.moveTo(chart.chartArea.left, y);
        ctx.lineTo(chart.chartArea.right, y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Draw label box
        var boxWidth = 70, boxHeight = 20;
        var boxX = chart.chartArea.left + 5;
        var boxY = y - boxHeight / 2;
        
        ctx.fillStyle = '#fff';
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        
        ctx.font = 'bold 11px Arial';
        ctx.fillStyle = '#000';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('BEAT $' + Math.round(beatPrice), boxX + 5, boxY + boxHeight / 2);
        ctx.restore();
      }
    };

    // Load saved prices
    var saved = localStorage.getItem('btcPrices');
    if (saved) {
      prices = JSON.parse(saved);
    }

    function initChart(startPrice) {
      while (prices.length < maxPoints) prices.push(startPrice);
      while (prices.length > maxPoints) prices.shift();

      chart = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: {
          labels: Array(maxPoints).fill(''),
          datasets: [{
            data: prices,
            borderColor: '#22c55e',
            backgroundColor: 'rgba(34,197,94,0.1)',
            fill: true,
            tension: 0.8,
            borderWidth: 2,
            pointRadius: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { display: false },
            beatLine: {}
          },
          scales: {
            x: { display: false },
            y: { 
              position: 'right',
              grid: { color: 'rgba(255,255,255,0.05)' },
              ticks: { color: '#64748b', callback: function(v) { return '$' + Math.round(v); } }
            }
          }
        },
        plugins: [beatLinePlugin]
      });

      document.getElementById('chartPrice').textContent = 'BTC $' + Math.round(startPrice);

      function updatePrice(p) {
        prices.push(p);
        if (prices.length > maxPoints) prices.shift();
        chart.data.datasets[0].data = prices;
        chart.update('none');
        document.getElementById('chartPrice').textContent = 'BTC $' + Math.round(p);
        localStorage.setItem('btcPrices', JSON.stringify(prices));
        
        // Update beat line
        chart.update();
      }

      // Update every second
      setInterval(function() {
        fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT')
          .then(function(r) { return r.json(); })
          .then(function(d) { updatePrice(parseFloat(d.price)); });
      }, 1000);
    }

    // Trading logic
    var btcPrice = 0;
    var manualBeatPrice = 0;
    var balance = 10000;
    var currentBet = null;
    var currentBetType = null;
    var currentBeatPrice = 0;
    const cycleDuration = 300;
    const payoutMultiplier = 1.95;

    var strikeEl = document.getElementById('strike');
    var titlePriceEl = document.getElementById('titlePrice');
    var balanceEl = document.getElementById('balance');
    var countdownEl = document.getElementById('countdown');
    var cycleLabelEl = document.getElementById('cycleLabel');
    var priceChangeEl = document.getElementById('priceChange');
    var messageEl = document.getElementById('message');
    var betAmountInput = document.getElementById('betAmount');

    function getCycleInfo() {
      var now = new Date();
      var totalSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      var cyclePosition = totalSeconds % cycleDuration;
      var remaining = cycleDuration - cyclePosition;
      return { remaining: remaining };
    }

    function addBet(amount) {
      var current = parseInt(betAmountInput.value) || 0;
      betAmountInput.value = current + amount;
    }

    function placeBet(type) {
      var amount = parseInt(betAmountInput.value);

      if (amount > balance) {
        messageEl.textContent = 'Insufficient balance!';
        return;
      }

      if (currentBetType && currentBetType !== type) {
        messageEl.textContent = 'You have a ' + currentBetType + ' bet! Wait for round to end.';
        return;
      }

      balance -= amount;
      if (currentBet) {
        currentBet += amount;
      } else {
        currentBet = amount;
        currentBetType = type;
      }

      balanceEl.textContent = '$' + balance.toLocaleString();
      messageEl.textContent = 'Bet placed: $' + amount + ' ' + type + '!';
    }

    function settleBet() {
      if (!currentBet || !currentBetType) return;

      var beatDiff = btcPrice - manualBeatPrice;
      var won = (currentBetType === 'UP' && beatDiff > 0) || (currentBetType === 'DOWN' && beatDiff < 0);

      if (won) {
        var winnings = currentBet * payoutMultiplier;
        balance += Math.round(winnings);
        messageEl.textContent = 'You WON $' + Math.round(winnings) + '! 🎉';
      } else {
        messageEl.textContent = 'You lost. Better luck next time!';
      }

      currentBet = null;
      currentBetType = null;
      balanceEl.textContent = '$' + balance.toLocaleString();
    }

    var lastCycleNum = -1;

    function update() {
      btcPrice = parseFloat(document.getElementById('chartPrice').textContent.replace('BTC $', '')) || btcPrice;

      var remaining = getCycleInfo().remaining;
      var now = new Date();
      var cycleNum = Math.floor((now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / cycleDuration);

      // New cycle
      if (cycleNum !== lastCycleNum && lastCycleNum !== -1) {
        settleBet();
        manualBeatPrice = btcPrice;
        currentBeatPrice = manualBeatPrice;
        beatPrice = manualBeatPrice;
        strikeEl.textContent = '$' + Math.round(manualBeatPrice);
        
        // Update beat line
        if (chart) chart.update();
      }
      lastCycleNum = cycleNum;

      // Update display
      titlePriceEl.textContent = 'BTC $' + Math.round(btcPrice);

      var mins = Math.floor(remaining / 60);
      var secs = remaining % 60;
      countdownEl.textContent = mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
      cycleLabelEl.textContent = countdownEl.textContent + ' remaining';

      var priceChange = ((btcPrice - manualBeatPrice) / manualBeatPrice) * 100;
      priceChangeEl.textContent = (priceChange >= 0 ? '+' : '') + priceChange.toFixed(2) + '%';
      priceChangeEl.style.color = priceChange >= 0 ? '#22c55e' : '#ef4444';
    }

    // Initialize
    fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var price = parseFloat(d.price);
        manualBeatPrice = price;
        currentBeatPrice = price;
        beatPrice = price;
        strikeEl.textContent = '$' + Math.round(manualBeatPrice);
        initChart(price);
      });

    setInterval(update, 1000);
  </script>
</body>
</html>
