<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PredictX - BTC 5MIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #0a0a0a; color: white; }
    .btn-up { background: #22c55e; }
    .btn-up:hover { background: #16a34a; }
    .btn-down { background: #ef4444; }
    .btn-down:hover { background: #dc2626; }
    .btn-cashout { background: #f59e0b; }
  </head>
</head>
<body>
  <!-- Header -->
  <header class="flex items-center justify-between" style="position:fixed;top:0;left:0;right:0;background:rgba(10,10,10,0.98);backdrop-filter:blur(10px);z-index:100;padding:10px 12px;border-bottom:1px solid #1e293b;">
    <div class="flex items-center gap-3">
      <a href="/" class="text-lg font-bold text-white" style="text-decoration:none;">PREDICTX</a>
      <nav class="hidden md:flex items-center gap-3">
        <a href="#" class="text-sm text-slate-400" style="text-decoration:none;">Markets</a>
        <a href="btc-live.html" class="text-sm text-blue-400" style="text-decoration:none;">5m</a>
        <a href="btc-15min.html" class="text-sm text-slate-400" style="text-decoration:none;">15m</a>
        <a href="btc-30min.html" class="text-sm text-slate-400" style="text-decoration:none;">30m</a>
        <a href="btc-1hour.html" class="text-sm text-slate-400" style="text-decoration:none;">1h</a>
      </nav>
    </div>
    <div class="flex items-center gap-1">
      <button onclick="showLogin()" class="text-xs bg-blue-600 px-2 py-1 rounded">Get Started</button>
    </div>
  </header>

  <div class="max-w-3xl mx-auto p-4" style="padding-top:80px;">
    <!-- Header Info -->
    <div class="flex items-center justify-between mb-3">
      <div>
        <div class="text-sm text-slate-400">Crypto • 5MIN</div>
        <h1 class="text-xl font-bold" id="titlePrice">BTC $0</h1>
        <div class="text-xs text-yellow-400" id="cycleLabel">05:00 remaining</div>
      </div>
      <div class="text-right">
        <div id="loginArea"><button onclick="showLogin()" class="text-xs bg-blue-600 px-3 py-1 rounded">Login to Trade</button></div>
        <div id="userArea" style="display:none;">
          <span class="text-xs text-slate-400">👤 <span id="username">User</span></span>
          <button onclick="logout()" class="text-xs bg-slate-600 px-2 py-0.5 rounded ml-2">Logout</button>
        </div>
        <div id="balanceArea" style="display:none;">
          <div class="text-3xl font-bold text-green-400" id="countdown">00:00</div>
          <div class="text-xs text-slate-400">Balance: <span id="balance" class="text-white font-bold">$10,000</span></div>
        </div>
        <div id="loginPrompt" class="text-xs text-slate-500">Login to start</div>
      </div>
    </div>

    <!-- Price Change -->
    <div class="text-center mb-2">
      <span id="priceChange" class="text-2xl font-bold">0.00%</span>
      <span class="text-sm text-slate-400"> from beat</span>
    </div>

    <!-- Chart -->
    <div class="bg-slate-900 rounded-xl border border-slate-800 p-3 mb-3">
      <canvas id="chart" style="height:400px;"></canvas>
    </div>

    <!-- Beat -->
    <div class="text-center mb-3">
      <span class="text-slate-400">Beat: </span>
      <span id="strike" class="font-bold">$0</span>
    </div>

    <!-- Position Panel -->
    <div id="positionPanel" class="bg-slate-800 rounded-lg p-3 mb-3" style="display:none;">
      <div class="flex items-center justify-between mb-2">
        <div><span class="text-sm text-slate-400">Your Bets</span><div class="font-bold text-green-400" id="positionSummary">$0</div></div>
        <div class="text-right"><span class="text-sm text-slate-400">Potential</span><div class="text-green-400 font-bold text-lg" id="totalPayout">$0</div></div>
      </div>
      <div class="text-center text-xs text-slate-500 mb-2" id="holdTimer"></div>
      <div class="flex gap-2">
        <button onclick="cashOutPercent(25)" class="flex-1 py-2 rounded-lg font-bold text-sm" style="background:#f59e0b;">Sell 25%</button>
        <button onclick="cashOutPercent(50)" class="flex-1 py-2 rounded-lg font-bold text-sm" style="background:#f59e0b;">Sell 50%</button>
        <button onclick="cashOutPercent(100)" class="flex-1 py-2 rounded-lg font-bold text-sm bg-red-500">Sell All</button>
      </div>
    </div>

    <!-- Betting -->
    <div class="bg-slate-900 rounded-xl border border-slate-800 p-3">
      <div class="mb-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm text-slate-400">Bet Amount</span>
        </div>
        <div class="flex gap-1">
          <button onclick="document.getElementById('betAmount').value='0'" class="px-2 py-1 bg-slate-600 rounded-lg text-xs">Clear</button>
          <input type="number" id="betAmount" value="100" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-white text-center">
          <button onclick="addBet(10)" class="px-2 py-1 bg-slate-700 rounded-lg text-xs">+10</button>
          <button onclick="addBet(50)" class="px-2 py-1 bg-slate-700 rounded-lg text-xs">+50</button>
          <button onclick="addBet(100)" class="px-2 py-1 bg-slate-700 rounded-lg text-xs">+100</button>
        </div>
      </div>
      <div class="flex gap-2">
        <button id="upBtn" class="flex-1 py-4 rounded-xl font-bold text-lg btn-up">UP</button>
        <button id="downBtn" class="flex-1 py-4 rounded-xl font-bold text-lg btn-down">DOWN</button>
      </div>
    </div>

    <div id="message" class="mt-3 text-center text-sm text-slate-400"></div>
  </div>

  <script>
    // === CHART ===
    var prices = [];
    var chart;
    var maxPoints = 150;
    var beatPrice = 0;
    var btcPrice = 0;

    // Load saved prices
    var saved = localStorage.getItem('btcPrices');
    if (saved) prices = JSON.parse(saved);

    // Beat line plugin
    var beatLinePlugin = {
      id: 'beatLine',
      afterDatasetsDraw: function(c) {
        if (!beatPrice) return;
        var y = c.scales.y.getPixelForValue(beatPrice);
        var ctx = c.ctx;
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.moveTo(c.chartArea.left, y);
        ctx.lineTo(c.chartArea.right, y);
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        var bw = 90, bh = 20, bx = c.chartArea.left + 5, by = y - bh/2;
        ctx.fillStyle = '#fff';
        ctx.fillRect(bx, by, bw, bh);
        ctx.strokeStyle = '#ccc';
        ctx.strokeRect(bx, by, bw, bh);
        ctx.font = 'bold 11px Arial';
        ctx.fillStyle = '#000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('BEAT $' + Math.round(beatPrice), bx + bw/2, by + bh/2);
        ctx.restore();
      }
    };

    function initChart(startPrice) {
      while (prices.length < maxPoints) prices.push(startPrice);
      while (prices.length > maxPoints) prices.shift();

      chart = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: {
          labels: Array(maxPoints).fill(''),
          datasets: [{ data: prices, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', fill: true, tension: 0.8, borderWidth: 2, pointRadius: 0 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { x: { display: false }, y: { position: 'right', grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', callback: function(v) { return '$' + Math.round(v); } } }
        },
        plugins: [beatLinePlugin]
      });

      function updatePrice(p) {
        prices.push(p);
        if (prices.length > maxPoints) prices.shift();
        chart.data.datasets[0].data = prices;
        chart.update('none');
        document.getElementById('titlePrice').textContent = 'BTC $' + Math.round(p);
        localStorage.setItem('btcPrices', JSON.stringify(prices));
        window.btcPrice = p;
        updateTrading();
        chart.update();
      }

      setInterval(function() {
        fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT')
          .then(function(r) { return r.json(); })
          .then(function(d) { updatePrice(parseFloat(d.price)); });
      }, 1000);
    }

    // === TRADING ===
    var balance = 10000;
    var currentBets = [];
    var manualBeatPrice = 0;
    var lastCycleNum = -1;
    var cycleDuration = 300;
    var payoutMultiplier = 1.95;
    var maxFeeTime = 30;

    function getCycleInfo() {
      var n = new Date();
      var t = n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds();
      return { remaining: cycleDuration - t % cycleDuration, cycleNum: Math.floor(t / cycleDuration) };
    }

    function addBet(amount) {
      var current = parseInt(document.getElementById('betAmount').value) || 0;
      document.getElementById('betAmount').value = current + amount;
    }

    function placeBet(type) {
      var user = JSON.parse(localStorage.getItem('user') || '{}');
      if (!user.email) { showLogin(); return; }
      
      var amount = parseInt(document.getElementById('betAmount').value);
      if (amount > balance) { document.getElementById('message').textContent = 'Insufficient balance!'; return; }
      if (currentBets.length > 0 && currentBets[0].type !== type) { document.getElementById('message').textContent = 'Sell first!'; return; }

      balance -= amount;
      currentBets.push({ type: type, amount: amount, betTime: Date.now() });
      document.getElementById('balance').textContent = '$' + balance.toLocaleString();
      document.getElementById('message').textContent = 'Bet: $' + amount + ' ' + type + '!';
      updatePayout();
    }

    function getPlatformFee() {
      if (!manualBeatPrice) return 0.01;
      var diff = Math.abs(btcPrice - manualBeatPrice);
      return 0.005 + Math.min(diff / (manualBeatPrice * 0.01), 1) * 0.015;
    }

    function calculatePayout(bet) {
      var r = getCycleInfo().remaining / cycleDuration;
      var p = 1.02 + (1.95 - 1.02) * r;
      var diff = btcPrice - manualBeatPrice;
      var thresh = manualBeatPrice * 0.01;
      var val = bet.amount;
      if (bet.type === 'UP') {
        if (diff > 0) val = bet.amount + bet.amount * (p - 1) * Math.min(Math.abs(diff) / thresh, 1) * r;
        else val = bet.amount - bet.amount * 0.5 * Math.min(Math.abs(diff) / thresh, 1) * (1 - r);
      } else {
        if (diff < 0) val = bet.amount + bet.amount * (p - 1) * Math.min(Math.abs(diff) / thresh, 1) * r;
        else val = bet.amount - bet.amount * 0.5 * Math.min(Math.abs(diff) / thresh, 1) * (1 - r);
      }
      return Math.max(0, val);
    }

    function updatePayout() {
      if (currentBets.length === 0) { document.getElementById('positionPanel').style.display = 'none'; return; }
      document.getElementById('positionPanel').style.display = 'block';
      
      var seconds = (Date.now() - currentBets[0].betTime) / 1000;
      var earlyFee = Math.max(0, 1 - seconds / maxFeeTime) * 0.10 * 100;
      var platFee = getPlatformFee() * 100;
      
      var timerEl = document.getElementById('holdTimer');
      if (earlyFee > 0.1) { timerEl.textContent = '⚡ Early: ' + earlyFee.toFixed(2) + '% + Fee: ' + platFee.toFixed(2) + '%'; timerEl.className = 'text-center text-xs text-yellow-500 mb-2'; }
      else { timerEl.textContent = '✅ Fee: ' + platFee.toFixed(2) + '%'; timerEl.className = 'text-center text-xs text-green-500 mb-2'; }
      
      var totalAmount = currentBets.reduce(function(s, b) { return s + b.amount; }, 0);
      var totalPotential = currentBets.reduce(function(s, b) { return s + calculatePayout(b); }, 0);
      var dir = currentBets[0].type;
      document.getElementById('positionSummary').innerHTML = currentBets.length + ' bet • $' + totalAmount + ' <span class="text-' + (dir === 'UP' ? 'green' : 'red') + '-400">' + (dir === 'UP' ? '▲' : '▼') + ' ' + dir + '</span>';
      document.getElementById('totalPayout').textContent = '$' + Math.round(totalPotential).toLocaleString();
    }

    function cashOutPercent(pct) {
      if (currentBets.length === 0) return;
      var totalValue = currentBets.reduce(function(s, b) { return s + calculatePayout(b); }, 0);
      var seconds = (Date.now() - currentBets[0].betTime) / 1000;
      var fee = totalValue * Math.max(0, 1 - seconds / maxFeeTime) * 0.10 + totalValue * getPlatformFee();
      var cash = totalValue * (pct / 100) - fee * (pct / 100);
      currentBets.forEach(function(b) { b.amount = b.amount * (1 - pct / 100); });
      currentBets = currentBets.filter(function(b) { return b.amount > 1; });
      balance += Math.round(cash);
      document.getElementById('balance').textContent = '$' + balance.toLocaleString();
      document.getElementById('message').textContent = 'Sold ' + pct + '% = $' + Math.round(cash) + '!';
      updatePayout();
    }

    function settleBets() {
      if (currentBets.length === 0) return;
      var winnings = 0, betAmount = 0;
      for (var i = 0; i < currentBets.length; i++) {
        var bet = currentBets[i];
        var diff = btcPrice - manualBeatPrice;
        var won = (bet.type === 'UP' && diff > 0) || (bet.type === 'DOWN' && diff < 0);
        betAmount += bet.amount;
        if (won) winnings += bet.amount * payoutMultiplier;
      }
      var pf = winnings * getPlatformFee();
      balance += Math.round(winnings - pf);
      var profit = Math.round(winnings - pf) - betAmount;
      document.getElementById('message').textContent = profit > 0 ? 'You WON $' + profit + '! 🎉' : profit < 0 ? 'You lost $' + Math.abs(profit) + '.' : 'Break even!';
      currentBets = [];
      document.getElementById('balance').textContent = '$' + balance.toLocaleString();
      updatePayout();
    }

    function updateTrading() {
      var info = getCycleInfo();
      document.getElementById('countdown').textContent = Math.floor(info.remaining / 60).toString().padStart(2, '0') + ':' + (info.remaining % 60).toString().padStart(2, '0');
      document.getElementById('cycleLabel').textContent = document.getElementById('countdown').textContent + ' remaining';
      
      if (manualBeatPrice) {
        var pc = ((btcPrice - manualBeatPrice) / manualBeatPrice) * 100;
        var ce = document.getElementById('priceChange');
        ce.textContent = (pc >= 0 ? '+' : '') + pc.toFixed(2) + '%';
        ce.className = 'text-2xl font-bold ' + (pc >= 0 ? 'text-green-400' : 'text-red-400');
      }
      
      if (info.cycleNum !== lastCycleNum && lastCycleNum !== -1) {
        settleBets();
        manualBeatPrice = btcPrice;
        beatPrice = btcPrice;
        document.getElementById('strike').textContent = '$' + Math.round(btcPrice);
      }
      lastCycleNum = info.cycleNum;
    }

    // === LOGIN ===
    function showLogin() {
      var email = prompt('Enter email:');
      if (email) {
        localStorage.setItem('user', JSON.stringify({ email: email, balance: 10000, username: email.split('@')[0] }));
        updateUserUI();
      }
    }
    function logout() { localStorage.removeItem('user'); location.reload(); }
    function updateUserUI() {
      var u = JSON.parse(localStorage.getItem('user') || '{}');
      if (u.email) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('userArea').style.display = 'block';
        document.getElementById('balanceArea').style.display = 'block';
        document.getElementById('loginPrompt').style.display = 'none';
        document.getElementById('username').textContent = u.username || 'User';
        document.getElementById('balance').textContent = '$' + (u.balance || 10000).toLocaleString();
      }
    }
    updateUserUI();

    // === INIT ===
    fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var price = parseFloat(d.price);
        manualBeatPrice = price;
        beatPrice = price;
        document.getElementById('strike').textContent = '$' + Math.round(price);
        initChart(price);
      });

    document.getElementById('upBtn').onclick = function() { placeBet('UP'); };
    document.getElementById('downBtn').onclick = function() { placeBet('DOWN'); };
  </script>
</body>
</html>
