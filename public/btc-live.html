<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PredictX - BTC 5MIN</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{background:#0a0a0a;margin:0;padding:0;font-family:system-ui,sans-serif}
    .header{position:fixed;top:0;left:0;right:0;background:#0f0f0f;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b;z-index:100}
    .logo{color:#fff;font-size:18px;font-weight:bold;text-decoration:none}
    .nav{display:flex;gap:16px}
    .nav a{color:#94a3b8;font-size:14px;text-decoration:none}
    .nav a.active{color:#3b82f6}
    .btn{background:#3b82f6;border:none;padding:8px 16px;border-radius:6px;color:#fff;cursor:pointer;font-size:14px}
    .container{max-width:800px;margin:0 auto;padding:70px 20px 20px}
    h1{color:#fff;font-size:24px;margin-bottom:10px}
    .chart-box{height:50vh;background:#1e293b;border-radius:12px;padding:10px}
    .price-row{display:flex;justify-content:space-between;margin-top:10px}
    .price{color:#22c55e;font-size:16px;font-weight:normal}
    .beat{color:#94a3b8;font-size:16px;font-weight:normal}
    .beat span{color:#fff;font-weight:bold}
    .change{font-size:20px;font-weight:bold}
    .change.up{color:#22c55e}
    .change.down{color:#ef4444}
    .countdown{font-size:28px;font-weight:bold;color:#fbbf24;margin-top:10px}
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="logo">PREDICTX</a>
    <nav class="nav">
      <a href="#">Markets</a>
      <a href="#" class="active">5m</a>
      <a href="#">15m</a>
      <a href="#">30m</a>
      <a href="#">1h</a>
    </nav>
    <button class="btn" onclick="alert('Login coming soon')">Sign In</button>
  </header>
  <div class="container">
    <h1 style="display:flex;justify-content:space-between;align-items:center">BTC 5MIN <span class="countdown" id="countdown" style="display:inline-block;vertical-align:middle;margin-top:0"></span></h1>
    <div class="chart-box" style="position:relative"><canvas id="c"></canvas></div>
    <div class="price-row">
      <div><div style="color:#94a3b8;font-size:8px">Current Price</div><div class="price" id="p">$0</div></div>
      <div class="beat"><div style="color:#94a3b8;font-size:8px">Price to Beat</div><span id="beat">$0</span></div>
      <div class="change" id="change">0%</div>
    </div>
  </div>
  <script>
var prices=[];
var chart;
var maxPoints=150;
var beatPrice=0;
var currentPrice=0;
var saved=localStorage.getItem('btcPrices');
if(saved){prices=JSON.parse(saved);}

// Beat line plugin
var beatLinePlugin={id:'beatLine',afterDatasetsDraw:function(c){if(!beatPrice)return;var y=c.scales.y.getPixelForValue(beatPrice);var ctx=c.ctx;ctx.save();ctx.beginPath();ctx.setLineDash([5,5]);ctx.moveTo(c.chartArea.left,y);ctx.lineTo(c.chartArea.right,y);ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.roundRect(c.chartArea.left+5,y-12,100,24,4);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#ccc';ctx.stroke();ctx.fillStyle='#000';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('BEAT $'+Math.round(beatPrice),c.chartArea.left+55,y+4);ctx.restore();}};

// Orange dot plugin
var dotPlugin={id:'dot',afterDatasetsDraw:function(c){if(prices.length===0)return;var lastPrice=prices[prices.length-1];var x=c.scales.x.getPixelForValue(prices.length-1);var y=c.scales.y.getPixelForValue(lastPrice);var ctx=c.ctx;ctx.save();ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fillStyle='rgba(249,115,22,0.3)';ctx.fill();ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle='#f97316';ctx.fill();ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.restore();}};

function init(startPrice){
beatPrice=startPrice;
currentPrice=startPrice;
while(prices.length<maxPoints)prices.push(startPrice);
while(prices.length>maxPoints)prices.shift();
chart=new Chart(document.getElementById('c'),{type:'line',data:{labels:Array(maxPoints).fill(''),datasets:[{data:prices,borderColor:'#22c55e',backgroundColor:'rgba(34,197,94,0.1)',fill:true,tension:0.8,borderWidth:2,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{position:'right',grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#64748b',callback:function(v){return'$'+Math.round(v)}}}}},plugins:[beatLinePlugin,dotPlugin]});
updateDisplay(startPrice);
function upd(p){prices.push(p);if(prices.length>maxPoints)prices.shift();chart.data.datasets[0].data=prices;chart.data.datasets[0].borderColor=p>=beatPrice?'#22c55e':'#ef4444';chart.data.datasets[0].backgroundColor=p>=beatPrice?'rgba(34,197,94,0.1)':'rgba(239,68,68,0.1)';chart.update('none');currentPrice=p;updateDisplay(p);localStorage.setItem('btcPrices',JSON.stringify(prices));}
setInterval(function(){fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT').then(function(r){return r.json()}).then(function(d){upd(parseFloat(d.price))})},1000);
setInterval(function(){var now=new Date();var sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();var rem=300-sec%300;document.getElementById('countdown').textContent=Math.floor(rem/60).toString().padStart(2,'0')+':'+(rem%60).toString().padStart(2,'0');},1000);}
function updateDisplay(p){document.getElementById('p').textContent='$'+Math.round(p);document.getElementById('beat').textContent='$'+Math.round(beatPrice);var ch=((p-beatPrice)/beatPrice*100).toFixed(2);var el=document.getElementById('change');el.textContent=(ch>=0?'+':'')+ch+'%';el.className='change '+(ch>=0?'up':'down');var now=new Date();var sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();var rem=300-sec%300;document.getElementById('countdown').textContent=Math.floor(rem/60).toString().padStart(2,'0')+':'+(rem%60).toString().padStart(2,'0');}
fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT').then(function(r){return r.json()}).then(function(d){init(parseFloat(d.price))});
  </script>
</body>
</html>
