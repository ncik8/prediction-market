<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PredictX - BTC 5MIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: white; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    .btn-up { background: #22c55e; }
    .btn-up:hover { background: #16a34a; }
    .btn-down { background: #ef4444; }
    .btn-down:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div style="max-width: 600px; margin: 0 auto; padding: 16px;">
    
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div>
        <div style="font-size: 14px; color: #94a3b8;">Crypto • 5MIN</div>
        <div style="font-size: 24px; font-weight: bold;" id="titlePrice">BTC $0</div>
        <div style="font-size: 12px; color: #fbbf24;" id="cycleLabel">05:00 remaining</div>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 28px; font-weight: bold; color: #22c55e;" id="countdown">00:00</div>
        <div style="font-size: 12px; color: #94a3b8;">Balance: <span id="balance" style="color: white;">$10,000</span></div>
      </div>
    </div>

    <!-- Price Change -->
    <div style="text-align: center; margin-bottom: 16px;">
      <span id="priceChange" style="font-size: 24px; font-weight: bold;">0.00%</span>
      <span style="font-size: 14px; color: #94a3b8;"> from beat</span>
    </div>

    <!-- Chart -->
    <div style="background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 16px;">
      <iframe src="/chart.html" style="width: 100%; height: 300px; border: none; background: #0f172a; border-radius: 8px;"></iframe>
    </div>

    <!-- Beat Price -->
    <div style="text-align: center; margin-bottom: 16px;">
      <span style="color: #94a3b8;">Beat: </span>
      <span id="strike" style="font-weight: bold;">$0</span>
    </div>

    <!-- Bet Amount -->
    <div style="margin-bottom: 16px;">
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="number" id="betAmount" value="100" style="flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: white; font-size: 18px; text-align: center;">
        <button onclick="addBet(10)" style="background: #334155; border: none; border-radius: 8px; padding: 12px 16px; color: white; cursor: pointer;">+10</button>
        <button onclick="addBet(50)" style="background: #334155; border: none; border-radius: 8px; padding: 12px 16px; color: white; cursor: pointer;">+50</button>
        <button onclick="addBet(100)" style="background: #334155; border: none; border-radius: 8px; padding: 12px 16px; color: white; cursor: pointer;">+100</button>
      </div>
    </div>

    <!-- Trading Buttons -->
    <div style="display: flex; gap: 12px;">
      <button onclick="placeBet('UP')" class="btn-up" style="flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; color: white; cursor: pointer;">UP</button>
      <button onclick="placeBet('DOWN')" class="btn-down" style="flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; color: white; cursor: pointer;">DOWN</button>
    </div>

    <!-- Message -->
    <div id="message" style="text-align: center; margin-top: 16px; color: #94a3b8; font-size: 14px;"></div>

  </div>

  <script>
    let btcPrice = 0;
    let manualBeatPrice = 0;
    let balance = 10000;
    let currentBet = null;
    const cycleDuration = 300;
    const payoutMultiplier = 1.95;

    const strikeEl = document.getElementById('strike');
    const titlePriceEl = document.getElementById('titlePrice');
    const balanceEl = document.getElementById('balance');
    const countdownEl = document.getElementById('countdown');
    const cycleLabelEl = document.getElementById('cycleLabel');
    const priceChangeEl = document.getElementById('priceChange');
    const messageEl = document.getElementById('message');
    const betAmountInput = document.getElementById('betAmount');

    function getCycleInfo() {
      const now = new Date();
      const totalSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const cyclePosition = totalSeconds % cycleDuration;
      const remaining = cycleDuration - cyclePosition;
      return { remaining };
    }

    async function fetchPrice() {
      try {
        const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
        const data = await res.json();
        return parseFloat(data.price);
      } catch { return 70000; }
    }

    function addBet(amount) {
      const current = parseInt(betAmountInput.value) || 0;
      betAmountInput.value = current + amount;
    }

    function placeBet(type) {
      const amount = parseInt(betAmountInput.value);
      
      if (amount > balance) {
        messageEl.textContent = 'Insufficient balance!';
        return;
      }
      
      if (currentBet && currentBet.type !== type) {
        messageEl.textContent = 'You have a bet! Wait for round to end.';
        return;
      }

      balance -= amount;
      if (currentBet) {
        currentBet.amount += amount;
      } else {
        currentBet = { type, amount, startPrice: manualBeatPrice };
      }
      
      balanceEl.textContent = '$' + balance.toLocaleString();
      messageEl.textContent = `Bet placed: $${amount} ${type}!`;
    }

    function settleBet() {
      if (!currentBet) return;
      
      const beatDiff = btcPrice - currentBet.startPrice;
      const won = (currentBet.type === 'UP' && beatDiff > 0) || (currentBet.type === 'DOWN' && beatDiff < 0);
      
      if (won) {
        const winnings = currentBet.amount * payoutMultiplier;
        balance += Math.round(winnings);
        messageEl.textContent = `You WON $${Math.round(winnings)}! 🎉`;
      } else {
        messageEl.textContent = 'You lost. Better luck next time!';
      }
      
      currentBet = null;
      balanceEl.textContent = '$' + balance.toLocaleString();
    }

    let lastCycleNum = -1;

    async function update() {
      btcPrice = await fetchPrice();
      
      const { remaining } = getCycleInfo();
      const cycleNum = Math.floor((new Date().getHours() * 3600 + new Date().getMinutes() * 60 + new Date().getSeconds()) / cycleDuration);
      
      // New cycle
      if (cycleNum !== lastCycleNum && lastCycleNum !== -1) {
        settleBet();
        manualBeatPrice = btcPrice;
        strikeEl.textContent = '$' + Math.round(manualBeatPrice);
      }
      lastCycleNum = cycleNum;
      
      // Update display
      titlePriceEl.textContent = 'BTC $' + Math.round(btcPrice);
      
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      countdownEl.textContent = mins.toString().padStart(2,'0') + ':' + secs.toString().padStart(2,'0');
      cycleLabelEl.textContent = countdownEl.textContent + ' remaining';
      
      const priceChange = ((btcPrice - manualBeatPrice) / manualBeatPrice) * 100;
      priceChangeEl.textContent = (priceChange >= 0 ? '+' : '') + priceChange.toFixed(2) + '%';
      priceChangeEl.style.color = priceChange >= 0 ? '#22c55e' : '#ef4444';
    }

    // Initialize
    fetchPrice().then(p => {
      manualBeatPrice = p;
      strikeEl.textContent = '$' + Math.round(manualBeatPrice);
    });

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
