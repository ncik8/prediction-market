<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PredictX - BTC 5MIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    body { 
      background: #0a0a0a; 
      color: white;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url('/public.png');
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      z-index: -1;
    }
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 10, 0.85);
      z-index: -1;
    }
    .btn-up { background: #22c55e; }
    .btn-up:hover { background: #16a34a; }
    .btn-down { background: #ef4444; }
    .btn-down:hover { background: #dc2626; }
    .btn-cashout { background: #f59e0b; }
    .btn-cashout:hover { background: #d97706; }
  </style>
</head>
<body>
  <!-- Top Header - Fixed -->
  <header class="flex items-center justify-between" style="position: fixed; top: 0; left: 0; right: 0; background: rgba(10,10,10,0.98); backdrop-filter: blur(10px); z-index: 100; padding: 10px 12px; border-bottom: 1px solid #1e293b;">
    <div class="flex items-center gap-3">
      <a href="/" class="text-lg font-bold text-white" style="text-decoration: none;">PREDICTX</a>
      <nav class="hidden md:flex items-center gap-3">
        <a href="#" class="text-sm text-slate-400 hover:text-white" style="text-decoration: none;">Markets</a>
        <a href="btc-live.html" class="text-sm text-blue-400" style="text-decoration: none;">5m</a>
        <a href="btc-15min.html" class="text-sm text-slate-400 hover:text-white" style="text-decoration: none;">15m</a>
        <a href="btc-30min.html" class="text-sm text-slate-400 hover:text-white" style="text-decoration: none;">30m</a>
        <a href="btc-1hour.html" class="text-sm text-slate-400 hover:text-white" style="text-decoration: none;">1h</a>
      </nav>
    </div>
    <div class="flex items-center gap-1">
      <button onclick="toggleLang()" class="text-xs bg-slate-700 px-2 py-1 rounded" style="border: none; color: #94a3b8; cursor: pointer;">中文</button>
      <button onclick="showLogin()" class="text-xs bg-transparent border border-slate-600 px-2 py-1 rounded" style="color: #94a3b8; cursor: pointer;">Sign In</button>
      <button onclick="showLogin()" class="text-xs bg-blue-600 px-2 py-1 rounded" style="border: none; color: white; cursor: pointer;">Get Started</button>
    </div>
  </header>

  <!-- Main Content -->
  <div class="max-w-3xl mx-auto p-4" style="padding-top: 80px;">

    <!-- Trading Header -->
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-3">
        <div>
          <div class="text-sm text-slate-400">Crypto • 5MIN</div>
          <h1 class="text-xl font-bold" id="titlePrice">BTC $0</h1>
          <div class="text-xs text-yellow-400" id="cycleLabel">05:00 remaining</div>
        </div>
      </div>
      <div class="text-right">
        <!-- Login / User Area -->
        <div id="loginArea">
          <button onclick="showLogin()" class="text-xs bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded mb-1">Login to Trade</button>
        </div>
        <div id="userArea" style="display: none;">
          <div class="flex items-center gap-2 justify-end mb-1">
            <span class="text-xs text-slate-400">👤 <span id="username">User</span></span>
            <button onclick="topUp()" class="text-xs bg-yellow-600 hover:bg-yellow-700 px-2 py-0.5 rounded">Top up $10K</button>
            <button onclick="logout()" class="text-xs bg-slate-600 hover:bg-slate-500 px-2 py-0.5 rounded">Logout</button>
          </div>
        </div>
        <button onclick="toggleLang()" id="langToggle" class="text-xs bg-slate-700 px-2 py-1 rounded mb-1">中文</button>
        <div id="balanceArea" style="display: none;">
          <div class="text-3xl font-bold text-green-400" id="countdown">00:00</div>
          <div class="text-xs text-slate-400"><span id="balanceLabel">Balance</span>: <span class="text-white font-bold" id="balance">$10,000</span></div>
          <div class="text-xs text-yellow-400"><span id="revenueLabel">Revenue</span>: <span id="platformRevenue">$0</span></div>
        </div>
        <div id="loginPrompt" class="text-xs text-slate-500">Login to start trading</div>
      </div>
    </div>

    <!-- Price Change from Beat -->
    <div class="text-center mb-2">
      <span id="priceChange" class="text-2xl font-bold">0.00%</span>
      <span class="text-sm text-slate-400" id="fromBeatLabel"> from beat</span>
    </div>

    <!-- Chart -->
    <div class="bg-slate-900 rounded-xl border border-slate-800 p-3 mb-3">
      <div style="height: 200px; width: 100%;">
        <canvas id="chart" style="height: 100% !important; width: 100% !important;"></canvas>
      </div>
      <div class="flex justify-between text-xs text-slate-500 mt-1" id="timeAxis"></div>
    </div>
    
    <!-- Bot Trades (Hidden) -->
    <div class="mt-2 text-xs space-y-0.5" id="botTrades" style="display: none;"></div>

    <!-- Market Rules (collapsible) -->
    <div class="mt-4 bg-slate-900/80 rounded-lg border border-slate-800">
      <div class="p-3 flex items-center justify-between cursor-pointer" onclick="toggleRules()">
        <h3 class="text-sm font-bold text-slate-400" id="rulesTitle">📋 Market Rules</h3>
        <span id="rulesArrow" class="text-slate-400">▼</span>
      </div>
      <div id="rulesContent" class="text-xs text-slate-500 space-y-1 px-3 pb-3" style="display: none;">
        <p>• <strong>Beat Price</strong> = BTC price when 5-min round starts</p>
        <p>• <strong>UP wins</strong> if final price is above beat</p>
        <p>• <strong>DOWN wins</strong> if final price is below beat</p>
        <p>• <strong>Payout</strong> decreases as round progresses (early = more)</p>
        <p>• <strong>Data Source:</strong> Real-time BTC/USDT price from Binance</p>
        <p>• <strong>Settlement:</strong> Final price is average of last 30 seconds</p>
        <p>• <strong>Direction:</strong> Can't have UP and DOWN at same time - sell first to switch</p>
        <p>• <strong>Lockout:</strong> 5 seconds between bets, 30s to avoid early-sell fee</p>
      </div>
    </div>

    <script>
    function toggleRules() {
      const content = document.getElementById('rulesContent');
      const arrow = document.getElementById('rulesArrow');
      if (content.style.display === 'none') {
        content.style.display = 'block';
        arrow.textContent = '▲';
        // Set content if empty
        if (!content.innerHTML) {
          content.innerHTML = `
            <p>• <strong>${t('beatPrice')}</strong> - ${t('roundStart')}</p>
            <p>• <strong>${t('upWins')}</strong></p>
            <p>• <strong>${t('downWins')}</strong></p>
            <p>• <strong>${t('payout')}</strong></p>
            <p>• <strong>${t('dataSource')}</strong></p>
            <p>• <strong>${t('settlement')}</strong></p>
            <p>• <strong>${t('direction')}</strong></p>
            <p>• <strong>${t('lockout')}</strong></p>
          `;
        }
      } else {
        content.style.display = 'none';
        arrow.textContent = '▼';
      }
    }
    
    // Tab switching
    function switchTab(tabName) {
      // Hide all contents
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      // Show selected content
      document.getElementById('content-' + tabName).style.display = 'block';
      
      // Reset all tab buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('text-green-400', 'border-b-2', 'border-green-400');
        btn.classList.add('text-slate-400');
      });
      
      // Highlight active tab
      const activeTab = document.getElementById('tab-' + tabName);
      activeTab.classList.remove('text-slate-400');
      activeTab.classList.add('text-green-400', 'border-b-2', 'border-green-400');
    }
    
    // Search functionality
    const tradeSearchEl = document.getElementById('tradeSearch');
    if (tradeSearchEl) {
      tradeSearchEl.addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase();
        const items = document.querySelectorAll('#historyList .trade-item');
        items.forEach(item => {
          const text = item.textContent.toLowerCase();
          item.style.display = text.includes(query) ? 'block' : 'none';
        });
      });
    }
    
    // Login functions
    function showLogin() {
      const modal = document.createElement('div');
      modal.id = 'loginModal';
      modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-50';
      modal.innerHTML = `
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 w-72" style="text-align: center;">
          <h2 class="text-lg font-bold mb-2" style="text-align: center;">Welcome Back</h2>
          <p class="text-xs text-slate-400 mb-3" style="text-align: center;">Login to your account</p>
          <input type="email" id="loginEmail" placeholder="Email" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 mb-2 text-white" style="font-size: 13px;">
          <input type="password" id="loginPassword" placeholder="Password" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 mb-3 text-white" style="font-size: 13px;">
          <button onclick="doLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg mb-3" style="font-size: 13px;">Login</button>
          
          <div class="relative flex py-2 items-center" style="margin: 10px 0;">
            <div class="flex-grow border-t border-slate-700"></div>
            <span class="flex-shrink mx-3 text-slate-500 text-xs">or continue with</span>
            <div class="flex-grow border-t border-slate-700"></div>
          </div>
          
          <button onclick="doSocialLogin('google')" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: white; color: black; font-weight: 600; padding: 10px; border-radius: 6px; border: none; cursor: pointer; width: 100%; font-size: 13px;">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          
          <p class="text-xs text-slate-400 mt-3" style="text-align: center;">
            Don't have an account? <button onclick="closeLogin(); setTimeout(showSignup, 100);" class="text-blue-400 font-bold" style="background: none; border: none; cursor: pointer; font-size: 13px;">Sign Up</button>
          </p>
          
          <button onclick="closeLogin()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg mt-3" style="font-size: 13px;">Cancel</button>
        </div>
      `;
      document.body.appendChild(modal);
    }
    
    function showSignup() {
      const modal = document.createElement('div');
      modal.id = 'signupModal';
      modal.className = 'fixed inset-0 bg-black/80 flex items-center justify-center z-50';
      modal.innerHTML = `
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 w-72" style="text-align: center;">
          <h2 class="text-lg font-bold mb-2" style="text-align: center;">Create Account</h2>
          <p class="text-xs text-slate-400 mb-3" style="text-align: center;">Sign up to get $10,000 demo</p>
          <input type="email" id="signupEmail" placeholder="Email" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 mb-2 text-white" style="font-size: 13px;">
          <input type="password" id="signupPassword" placeholder="Password" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 mb-2 text-white" style="font-size: 13px;">
          <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 mb-3 text-white" style="font-size: 13px;">
          <button onclick="doSignup()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg mb-3" style="font-size: 13px;">Sign Up</button>
          
          <p class="text-xs text-slate-400" style="text-align: center;">
            Already have an account? <button onclick="closeSignup(); setTimeout(showLogin, 100);" class="text-blue-400 font-bold" style="background: none; border: none; cursor: pointer; font-size: 13px;">Login</button>
          </p>
          
          <button onclick="closeSignup()" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg mt-3" style="font-size: 13px;">Cancel</button>
        </div>
      `;
      document.body.appendChild(modal);
    }
    
    function closeSignup() {
      const modal = document.getElementById('signupModal');
      if (modal) modal.remove();
    }
    
    async function doSocialLogin(provider) {
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: provider,
        options: {
          redirectTo: window.location.href
        }
      });
      
      if (error) {
        alert('Login error: ' + error.message);
      }
    }
    
    function closeLogin() {
      document.getElementById('loginModal').remove();
    }
    
    async function doLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });
      
      if (error) {
        alert('Login error: ' + error.message);
        return;
      }
      
      // Get user profile
      const { data: profile } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', data.user.id)
        .single();
      
      // Save to localStorage
      localStorage.setItem('user', JSON.stringify(profile || { email: email, balance: 10000 }));
      
      // Update UI - show logged in state
      document.getElementById('loginArea').style.display = 'none';
      document.getElementById('userArea').style.display = 'block';
      document.getElementById('balanceArea').style.display = 'block';
      document.getElementById('loginPrompt').style.display = 'none';
      document.getElementById('username').textContent = profile?.username || email.split('@')[0];
      
      // Update balance display
      const balance = profile?.balance || 10000;
      document.getElementById('balance').textContent = '$' + balance.toLocaleString();
      
      closeLogin();
    }
    
    async function doSignup() {
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('signupConfirmPassword').value;
      
      if (!email || !password) {
        alert('Please fill in all fields');
        return;
      }
      
      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }
      
      if (password.length < 6) {
        alert('Password must be at least 6 characters');
        return;
      }
      
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
      });
      
      if (error) {
        alert('Signup error: ' + error.message);
        return;
      }
      
      // Create profile with $10,000 balance
      if (data.user) {
        await supabase.from('profiles').insert({
          id: data.user.id,
          username: email.split('@')[0],
          balance: 10000
        });
      }
      
      alert('Account created! You now have $10,000 demo balance.');
      closeSignup();
      showLogin();
    }
    
    // Top up balance to $10,000 max
    async function topUp() {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (!user.id) {
        alert('Please login first');
        return;
      }
      
      const currentBalance = user.balance || 0;
      const maxBalance = 10000;
      const topUpAmount = maxBalance - currentBalance;
      
      if (topUpAmount <= 0) {
        alert('You already have $10,000 balance!');
        return;
      }
      
      // Update balance in Supabase
      const { error } = await supabase
        .from('profiles')
        .update({ balance: maxBalance })
        .eq('id', user.id);
      
      if (error) {
        alert('Error: ' + error.message);
        return;
      }
      
      // Update local
      user.balance = maxBalance;
      localStorage.setItem('user', JSON.stringify(user));
      
      // Update UI
      document.getElementById('balance').textContent = '$10,000';
      alert('Added $' + topUpAmount + '! Total balance: $10,000');
    }
    
    // Logout
    function logout() {
      localStorage.removeItem('user');
      document.getElementById('loginArea').style.display = 'block';
      document.getElementById('userArea').style.display = 'none';
      document.getElementById('balanceArea').style.display = 'none';
      document.getElementById('loginPrompt').style.display = 'block';
      document.getElementById('balance').textContent = '$10,000';
    }
    
    // Check login on page load
    async function checkLogin() {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (user.id) {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('userArea').style.display = 'block';
        document.getElementById('balanceArea').style.display = 'block';
        document.getElementById('loginPrompt').style.display = 'none';
        document.getElementById('username').textContent = user.username || 'User';
        document.getElementById('balance').textContent = '$' + (user.balance || 10000).toLocaleString();
      }
    }
    
    // Run checkLogin on load
    checkLogin();
    
    // Auto-show login if ?login=1 in URL
    if (new URLSearchParams(window.location.search).get('login') === '1') {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (!user.id) {
        showLogin();
      }
    }
    
    // Update betting panel based on login status
    function updateBettingPanel() {
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      const prompt = document.getElementById('bettingLoginPrompt');
      const form = document.getElementById('bettingForm');
      
      if (!user.id) {
        if (prompt) prompt.style.display = 'block';
        // Hide trading buttons
        const upBtn = document.getElementById('upBtn');
        const downBtn = document.getElementById('downBtn');
        if (upBtn) upBtn.style.display = 'none';
        if (downBtn) downBtn.style.display = 'none';
      } else {
        if (prompt) prompt.style.display = 'none';
      }
    }
    
    updateBettingPanel();
    </script>

    <!-- Current Positions -->
    <div id="positionPanel" class="bg-slate-800 rounded-lg p-3 mb-3" style="display: none;">
      <div class="flex items-center justify-between mb-2">
        <div>
          <div class="text-sm text-slate-400" id="yourBetsLabel">Your Bets</div>
          <div class="font-bold text-green-400" id="positionSummary">$0</div>
        </div>
        <div class="text-right">
          <div class="text-sm text-slate-400" id="totalPotentialLabel">Total Potential</div>
          <div class="text-green-400 font-bold text-lg" id="totalPayout">$0</div>
        </div>
      </div>
      <div class="text-center text-xs text-slate-500 mb-2" id="holdTimer"></div>
      <div class="flex gap-2">
        <button onclick="cashOutPercent(25)" id="sell25Btn" class="flex-1 py-2 rounded-lg font-bold text-sm btn-cashout">Sell 25%</button>
        <button onclick="cashOutPercent(50)" id="sell50Btn" class="flex-1 py-2 rounded-lg font-bold text-sm btn-cashout">Sell 50%</button>
        <button onclick="cashOutPercent(100)" id="sellAllBtn" class="flex-1 py-2 rounded-lg font-bold text-sm bg-red-500 hover:bg-red-600">Sell All</button>
      </div>
    </div>

    <!-- Betting Panel -->
    <div id="bettingPanel" class="bg-slate-900 rounded-xl border border-slate-800 p-3">
      <div id="bettingLoginPrompt" class="text-center py-8" style="display: none;">
        <p class="text-slate-400 mb-4">🔒 Login required to trade</p>
        <button onclick="showLogin()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">Login to Start Trading</button>
      </div>
      <div id="bettingForm">
      <div class="mb-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm text-slate-400" id="betAmountLabel">Bet Amount</span>
          <span class="text-sm text-slate-400"><span id="strikeLabel">Beat</span>: <span class="text-white font-bold" id="strike">$0</span></span>
        </div>
        <div class="flex gap-1" style="overflow-x: auto;">
          <button class="px-2 py-1 bg-slate-600 rounded-lg text-xs" id="clearBtn" onclick="document.getElementById('betAmount').value = '0'">Clear</button>
          <input type="number" id="betAmount" value="0" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-white font-mono text-center" style="min-width: 60px;">
          <button class="px-2 py-1 bg-slate-700 rounded-lg text-xs" onclick="addBetAmount(1)">+1</button>
          <button class="px-2 py-1 bg-slate-700 rounded-lg text-xs" onclick="addBetAmount(10)">+10</button>
          <button class="px-2 py-1 bg-slate-700 rounded-lg text-xs" onclick="addBetAmount(50)">+50</button>
          <button class="px-2 py-1 bg-slate-700 rounded-lg text-xs" onclick="addBetAmount(100)">+100</button>
        </div>
      </div>

      <div class="flex gap-2">
        <button id="upBtn" class="flex-1 py-4 rounded-xl font-bold text-lg btn-up">UP</button>
        <button id="downBtn" class="flex-1 py-4 rounded-xl font-bold text-lg btn-down">DOWN</button>
      </div>
    </div>

    <!-- Tabs Container -->
    <div class="mt-4 bg-slate-900 rounded-xl border border-slate-800 p-3">
      <!-- Tab Headers -->
      <div class="flex border-b border-slate-700 mb-3">
        <button onclick="switchTab('positions')" id="tab-positions" class="tab-btn flex-1 pb-2 text-sm font-bold text-green-400 border-b-2 border-green-400">Positions</button>
        <button onclick="switchTab('openOrders')" id="tab-openOrders" class="tab-btn flex-1 pb-2 text-sm font-bold text-slate-400">Open Orders</button>
        <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1 pb-2 text-sm font-bold text-slate-400">History</button>
      </div>
      
      <!-- Search Bar -->
      <div class="mb-3">
        <input type="text" id="tradeSearch" placeholder="🔍 Search trades..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
      </div>
      
      <!-- Tab Content: Positions -->

    function getPlatformFee() {

      const probability = Math.min(beatDiff / priceThreshold, 1);

      // fee = 0.005 + probability * 0.015 (linear from 0.5% to 2%)
      const minFee = 0.005;
      const maxFee = 0.02;
      const fee = minFee + probability * (maxFee - minFee);
      return fee;
    }

    // Calculate payout for a single bet
    function calculateBetPayout(bet) {
      const { remaining } = getCycleInfo();
      const timeRemaining = remaining / cycleDuration;
      const minPayout = 1.02; // 2% at very end
      const maxPayout = 1.95; // 95% at start
      const payoutRatio = minPayout + (maxPayout - minPayout) * timeRemaining;
      
      const beatDiff = btcPrice - manualBeatPrice;
      const priceThreshold = manualBeatPrice * 0.01; // 1% threshold
      
      // Base value starts at your bet amount
      let currentValue = bet.amount;
      
      if (bet.type === 'UP') {
        if (beatDiff > 0) {
          // Price is above beat - you're winning!
          const profitRatio = Math.min(Math.abs(beatDiff) / priceThreshold, 1);
          currentValue = bet.amount + (bet.amount * (payoutRatio - 1) * profitRatio * timeRemaining);
        } else {
          // Price is below beat - you're losing
          const lossRatio = Math.min(Math.abs(beatDiff) / priceThreshold, 1);
          currentValue = bet.amount - (bet.amount * 0.5 * lossRatio * (1 - timeRemaining));
        }
      } else { // DOWN
        if (beatDiff < 0) {
          // Price is below beat - you're winning!
          const profitRatio = Math.min(Math.abs(beatDiff) / priceThreshold, 1);
          currentValue = bet.amount + (bet.amount * (payoutRatio - 1) * profitRatio * timeRemaining);
        } else {
          // Price is above beat - you're losing
          const lossRatio = Math.min(Math.abs(beatDiff) / priceThreshold, 1);
          currentValue = bet.amount - (bet.amount * 0.5 * lossRatio * (1 - timeRemaining));
        }
      }
      
      return Math.max(0, currentValue); // Never negative
    }

    // Cash out percentage - with fee for fast sells
    function cashOutPercent(percent) {
      if (currentBets.length === 0) return;
      
      // Calculate total current value
      let totalValue = 0;
      for (let bet of currentBets) {
        totalValue += calculateBetPayout(bet);
      }
      
      // Calculate fee based on how fast selling
      const now = Date.now();
      const oldestBet = currentBets[0];
      const secondsSinceBet = (now - oldestBet.betTime) / 1000;
      const maxFee = 0.10; // 10% early sell fee max
      const feeRatio = Math.max(0, 1 - (secondsSinceBet / maxFeeTime));
      const earlyFee = totalValue * feeRatio * maxFee;
      const platFee = totalValue * getPlatformFee(); // Dynamic Polymarket-style fee
      const totalFee = earlyFee + platFee;
      
      // How much to cash out after fees
      const cashOutAmount = totalValue * (percent / 100) - totalFee * (percent / 100);
      
      // Reduce each bet by the percentage
      let removed = 0;
      for (let bet of currentBets) {
        const betValue = calculateBetPayout(bet);
        const removeFromThis = betValue * (percent / 100);
        bet.amount = bet.amount * (1 - percent / 100); // Reduce amount
        removed += removeFromThis;
      }
      
      // Remove bets that are now near zero
      currentBets = currentBets.filter(b => b.amount > 1);
      
      // Deduct platform fee from user balance and add to revenue
      platformRevenue += platFee * (percent / 100);
      balance += Math.round(cashOutAmount);
      updateBalance();
      
      // Show message with fee info
      if (currentBets.length === 0) {
        messageEl.textContent = `Sold ${percent}% = $${Math.round(cashOutAmount)}! (early: $${Math.round(earlyFee * percent / 100)}, platform: $${Math.round(platFee * percent / 100)})`;
      } else {
        const remaining = currentBets.reduce((s, b) => s + b.amount, 0);
        const remainingValue = currentBets.reduce((s, b) => s + calculateBetPayout(b), 0);
        messageEl.textContent = `Sold ${percent}% = $${Math.round(cashOutAmount)}. Left: $${remaining} ($${Math.round(remainingValue)})`;
      }
      
      updatePayout();
    }

    // Settle all bets at end of cycle
    function settleBets() {
      if (currentBets.length === 0) return;
      
      let totalWinnings = 0;
      let totalBetAmount = 0;
      
      for (let bet of currentBets) {
        const beatDiff = btcPrice - manualBeatPrice;
        const won = (bet.type === 'UP' && beatDiff > 0) || (bet.type === 'DOWN' && beatDiff < 0);
        totalBetAmount += bet.amount;
        
        if (won) {
          totalWinnings += bet.amount * payoutMultiplier;
        }
      }
      
      // Deduct platform fee from winnings and add to revenue (dynamic Polymarket-style)
      const platFeeCollected = totalWinnings * getPlatformFee();
      platformRevenue += platFeeCollected;
      const netWinnings = totalWinnings - platFeeCollected;
      
      balance += Math.round(netWinnings);
      updateBalance();
      
      const profit = Math.round(netWinnings) - totalBetAmount;
      if (profit > 0) {
        messageEl.textContent = `You WON $${profit}! (platform fee: $${Math.round(platFeeCollected)}) 🎉`;
      } else if (profit < 0) {
        messageEl.textContent = `You lost $${Math.abs(profit)}. Better luck next time!`;
      } else {
        messageEl.textContent = 'Break even!';
      }
      
      // Clear all bets
      currentBets = [];
      updatePayout();
    }

    async function backupPriceData(priceData) {
      try {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!user.id) return; // Only backup if logged in
        
        // Get existing backup
        const { data: existing } = await supabase

        // Merge with existing data

        }
        allData = allData.concat(priceData);
        
        // Keep last 2 years
        const twoYears = 2 * 365 * 24 * 60 * 60 * 1000;
        const cutoff = Date.now() - twoYears;
        allData = allData.filter(p => p.time > cutoff);
        
        // Save to Supabase
        await supabase.from('price_history').upsert({
          user_id: user.id,
          data: allData,
          updated_at: new Date().toISOString()
        });
      } catch(e) {
        // Silently fail - backup is optional
      }
    }

    function calculateMA(prices, period) {
      if (prices.length < period) return prices[prices.length - 1];
      let sum = 0;
      for (let i = prices.length - period; i < prices.length; i++) {
        sum += prices[i];
      }
      return sum / period;
    }

      const cycleNum = Math.floor(totalSeconds / cycleDuration);
      return { remaining, cycleNum, now };
    }

              max: manualBeatPrice + 100,
              grid: { color: 'rgba(255,255,255,0.05)' },
              ticks: { color: '#64748b', callback: v => '$' + Math.round(v) }
            }
          }
        },
        plugins: [dotPlugin]
      });

      let lastCycleNum = getCycleInfo().cycleNum;

      function updateTime() {
        const { remaining, cycleNum, now } = getCycleInfo();
        
        if (cycleNum !== lastCycleNum) {
          settleBets();
          lastCycleNum = cycleNum;
          manualBeatPrice = btcPrice;
          document.getElementById('cycleLabel').textContent = '05:00 remaining';
          strikeEl.textContent = '$' + Math.round(manualBeatPrice);
          
          // Update URL with new cycle
          const h = now.getHours().toString().padStart(2,'0');
          const cycleId = `${h}:${(Math.floor(now.getMinutes() / 5) * 5).toString().padStart(2,'0')}`;
          window.history.replaceState({}, '', `?cycle=${cycleId}&beat=${Math.round(manualBeatPrice)}`);
          
          for (let i = 0; i < dataPoints; i++) {
            rawPrices[i] = btcPrice;
            maPrices[i] = btcPrice;
          }
        }
        
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        const timeStr = mins.toString().padStart(2,'0') + ':' + secs.toString().padStart(2,'0');
        document.getElementById('countdown').textContent = timeStr;
        document.getElementById('cycleLabel').textContent = timeStr + ' remaining';
        
        const h = now.getHours().toString().padStart(2,'0');
        const s = now.getSeconds();
        const html = [];
        for (let i = 5; i >= 0; i--) {
          let sec = s - (i * 5);
          let min = now.getMinutes();
          if (sec < 0) { sec += 60; min -= 1; }
          let label = h + ':' + min.toString().padStart(2,'0') + ':' + sec.toString().padStart(2,'0');
          html.push(`<span class="${i === 0 ? 'text-green-400 font-bold' : ''}">${label}</span>`);
        }
        document.getElementById('timeAxis').innerHTML = html.join('');
      }

      async function update() {
        const newPrice = await fetchPrice();
        const variation = (Math.random() - 0.5) * (manualBeatPrice * 0.002);
        btcPrice = newPrice + variation;
        prevPrice = btcPrice;
        
        // Save to localStorage (keep last 1 hour for chart)
        try {
          const priceData = JSON.parse(localStorage.getItem('btcPriceHistory') || '[]');
          priceData.push({ price: btcPrice, time: Date.now() });
          // Keep last 1 hour (~18000 points at 200ms intervals)
          const oneHour = 60 * 60 * 1000;
          const cutoff = Date.now() - oneHour;
          const recent = priceData.filter(p => p.time > cutoff);
          localStorage.setItem('btcPriceHistory', JSON.stringify(recent));
          
          // Backup to Supabase every 100 points
          if (priceData.length % 100 === 0) {
            backupPriceData(priceData);
          }
        } catch(e) {}
        
        rawPrices.shift();
        rawPrices.push(btcPrice);
        
        const ma = calculateMA(rawPrices, maPeriod);
        maPrices.shift();
        maPrices.push(ma);
        
        // Dynamic range based on price movement
        const priceDistance = Math.abs(btcPrice - manualBeatPrice);
        const threshold = currentRange * 0.65;
        
        if (priceDistance > threshold) {
          currentRange += (priceDistance - threshold) * 0.1;
        } else if (currentRange > 100 && priceDistance < threshold * 0.5) {
          currentRange -= 0.5;
          if (currentRange < 100) currentRange = 100;
        }
        
        chart.options.scales.y.min = manualBeatPrice - currentRange;
        chart.options.scales.y.max = manualBeatPrice + currentRange;
        
        const currentMA = maPrices[maPrices.length - 1];
        const lineColor = currentMA >= manualBeatPrice ? '#22c55e' : '#ef4444';
        chart.data.datasets[0].borderColor = lineColor;
        chart.data.datasets[0].backgroundColor = lineColor + '1A';
        
        titlePriceEl.textContent = 'BTC $' + Math.round(btcPrice);
        
        // Update percentage - use MA for consistency with chart color
        const priceChange = ((currentMA - manualBeatPrice) / manualBeatPrice) * 100;
        const changeEl = document.getElementById('priceChange');
        changeEl.textContent = (priceChange >= 0 ? '+' : '') + priceChange.toFixed(2) + '%';
        changeEl.className = 'text-2xl font-bold ' + (priceChange >= 0 ? 'text-green-400' : 'text-red-400');
        
        chart.update('none');
        
        updateTime();
        updatePayout();
      }

      document.getElementById('upBtn').onclick = () => placeBet('UP');
      document.getElementById('downBtn').onclick = () => placeBet('DOWN');

      updateTime();
      update();
      setInterval(update, 200);
    }

    initSidebar();
    init();
  </script>
</body>
</html>
