<!DOCTYPE html>
<html>
<head>
  <title>PredictX Data Feed</title>
  <meta http-equiv="refresh" content="60">
</head>
<body style="background:#111;color:#666;font-family:monospace;padding:20px;">
<h3 style="color:#333">PredictX Data Feed</h3>
<p id="status">Starting...</p>
<script>
document.getElementById('status').textContent = 'Running...';

async function fetchPrice() {
  try {
    const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
    const data = await res.json();
    return parseFloat(data.price);
  } catch { return null; }
}

async function update() {
  const price = await fetchPrice();
  if (!price) {
    document.getElementById('status').textContent = 'Error fetching price';
    return;
  }
  
  const now = Date.now();
  
  // Get existing data
  let data = [];
  try {
    data = JSON.parse(localStorage.getItem('btcPriceHistory') || '[]');
  } catch(e) {}
  
  // Add new price
  data.push({price: price, time: now});
  
  // Keep last 1 hour
  const oneHour = 60 * 60 * 1000;
  const cutoff = now - oneHour;
  data = data.filter(function(p) { return p.time > cutoff; });
  
  // Save
  localStorage.setItem('btcPriceHistory', JSON.stringify(data));
  localStorage.setItem('btcLatestPrice', price);
  localStorage.setItem('btcLatestTime', now);
  
  document.getElementById('status').textContent = 'Price: $' + price + ' | Points: ' + data.length;
}

// Run
update();
setInterval(update, 200);
</script>
</body>
</html>
