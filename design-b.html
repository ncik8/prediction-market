<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design B - Minimal Dark</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #e0e0e0; font-family: 'Inter', -apple-system, sans-serif; min-height: 100vh; }
    
    .header { background: #111; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
    .logo { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .asset-info { display: flex; align-items: baseline; gap: 16px; }
    .asset-name { font-size: 18px; font-weight: 600; color: #fff; }
    .asset-price { font-size: 32px; font-weight: 700; color: #22c55e; }
    
    .main { display: flex; height: calc(100vh - 65px); }
    
    .chart-section { flex: 1; padding: 24px; display: flex; flex-direction: column; }
    .beat-price { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .beat-label { background: #222; padding: 8px 16px; border-radius: 6px; font-size: 12px; color: #888; font-weight: 600; }
    .beat-value { font-size: 24px; font-weight: 700; color: #fff; }
    .timer { margin-left: auto; background: #111; padding: 12px 24px; border-radius: 8px; font-size: 18px; font-weight: 600; }
    
    .chart-container { flex: 1; background: #0f0f0f; border-radius: 12px; border: 1px solid #222; position: relative; overflow: hidden; }
    
    .trade-card { width: 340px; background: #111; border-left: 1px solid #222; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    
    .balance-row { display: flex; justify-content: space-between; align-items: center; }
    .balance-label { color: #666; font-size: 13px; }
    .balance-value { font-size: 28px; font-weight: 700; color: #fff; }
    
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-label { color: #666; font-size: 12px; font-weight: 500; }
    .amount-input { background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 16px; color: #fff; font-size: 20px; font-weight: 600; }
    .quick-amounts { display: flex; gap: 8px; }
    .quick-btn { flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 10px; color: #888; font-size: 14px; cursor: pointer; }
    
    .trade-buttons { display: flex; flex-direction: column; gap: 12px; }
    .btn-up { background: linear-gradient(135deg, #22c55e, #16a34a); border: none; color: #fff; padding: 20px; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-down { background: linear-gradient(135deg, #ef4444, #dc2626); border: none; color: #fff; padding: 20px; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    .active-position { background: #1a1a1a; border-radius: 10px; padding: 16px; }
    .position-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .position-dir { font-weight: 700; font-size: 16px; }
    .position-dir.up { color: #22c55e; }
    .position-dir.down { color: #ef4444; }
    .position-size { color: #666; font-size: 14px; }
    .position-value { font-size: 24px; font-weight: 700; color: #22c55e; text-align: right; }
    
    .cashout-row { display: flex; gap: 8px; margin-top: 12px; }
    .cashout-btn { flex: 1; background: #222; border: 1px solid #333; border-radius: 6px; padding: 10px; color: #888; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">PREDICTX</div>
    <div class="asset-info">
      <span class="asset-name">BTC/USDT</span>
      <span class="asset-price">$73,245</span>
    </div>
  </div>
  
  <div class="main">
    <div class="chart-section">
      <div class="beat-price">
        <span class="beat-label">BEAT PRICE</span>
        <span class="beat-value">$73,200</span>
        <span class="timer">4:32</span>
      </div>
      <div class="chart-container">
        <svg style="width:100%;height:100%;padding:20px;" viewBox="0 0 800 400" preserveAspectRatio="none">
          <defs>
            <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.3" />
              <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0" />
            </linearGradient>
          </defs>
          <path d="M0,350 Q100,300 200,320 T400,250 T600,200 T800,150 L800,400 L0,400 Z" fill="url(#greenGrad)"/>
          <polyline fill="none" stroke="#22c55e" stroke-width="3" points="0,350 100,300 200,320 300,280 400,250 500,220 600,200 700,180 800,150"/>
        </svg>
      </div>
    </div>
    
    <div class="trade-card">
      <div class="balance-row">
        <span class="balance-label">Balance</span>
        <span class="balance-value">$10,000</span>
      </div>
      
      <div class="input-group">
        <span class="input-label">Amount</span>
        <input type="text" class="amount-input" value="$500">
        <div class="quick-amounts">
          <button class="quick-btn">$100</button>
          <button class="quick-btn">$250</button>
          <button class="quick-btn">$500</button>
          <button class="quick-btn">Max</button>
        </div>
      </div>
      
      <div class="trade-buttons">
        <button class="btn-up">▲ Price Goes UP</button>
        <button class="btn-down">▼ Price Goes DOWN</button>
      </div>
      
      <div class="active-position">
        <div class="position-header">
          <span class="position-dir up">▲ UP</span>
          <span class="position-size">$300</span>
        </div>
        <div class="position-value">+$285</div>
        <div class="cashout-row">
          <button class="cashout-btn">Cashout 25%</button>
          <button class="cashout-btn">Cashout 50%</button>
          <button class="cashout-btn">Cashout All</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
