<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PredictX - BTC 1HOUR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #0a0a0a; color: white; }
  </style>
</head>
<body>
  <div class="max-w-3xl mx-auto p-4">
    <div class="flex items-center justify-between mb-2">
      <div>
        <div class="text-sm text-slate-400">Crypto • 1HOUR</div>
        <h1 class="text-xl font-bold" id="titlePrice">BTC $0.00</h1>
        <div class="text-xs text-yellow-400" id="cycleLabel">60:00 remaining</div>
      </div>
      <span class="text-3xl font-bold text-green-400" id="countdown">00:00</span>
    </div>

    <div class="bg-slate-900 rounded-xl border border-slate-800 p-3">
      <div class="h-64">
        <canvas id="chart"></canvas>
      </div>
      
      <div class="flex justify-between text-xs text-slate-500 mt-1" id="timeAxis"></div>
    </div>

    <div class="flex gap-2 mt-3">
      <button class="flex-1 py-3 rounded-lg font-bold bg-green-500">UP 50¢</button>
      <button class="flex-1 py-3 rounded-lg font-bold bg-red-500">DOWN 51¢</button>
    </div>

    <div class="flex justify-between mt-3 text-sm">
      <span class="text-slate-400">Beat: <span class="text-white font-bold" id="strike">$0</span></span>
      <span class="text-slate-400">Vol: <span class="text-white font-bold">$65K</span></span>
    </div>
  </div>

  <script>
    let btcPrice = 0;
    let manualBeatPrice = 0;
    let prevPrice = 0;
    
    const rawPrices = [];
    const maPeriod = 10;
    const maPrices = [];
    const dataPoints = 150;
    const cycleDuration = 3600; // 1 hour
    
    async function fetchPrice() {
      try {
        const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
        const data = await res.json();
        return parseFloat(data.price);
      } catch { return 82500; }
    }
    
    function calculateMA(prices, period) {
      if (prices.length < period) return prices[prices.length - 1];
      let sum = 0;
      for (let i = prices.length - period; i < prices.length; i++) {
        sum += prices[i];
      }
      return sum / period;
    }
    
    function getCycleInfo() {
      const now = new Date();
      const totalSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const remaining = cycleDuration - (totalSeconds % cycleDuration);
      return { remaining, now };
    }

    const dotPlugin = {
      id: 'dotPlugin',
      afterDatasetsDraw: (chart) => {
        const ctx = chart.ctx;
        const meta = chart.getDatasetMeta(0);
        const points = meta.data;
        const lastPoint = points[points.length - 1];
        
        const x = lastPoint.x;
        const y = lastPoint.y;
        
        const strikeY = chart.scales.y.getPixelForValue(manualBeatPrice);
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.moveTo(chart.chartArea.left, strikeY);
        ctx.lineTo(chart.chartArea.right, strikeY);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.setLineDash([]);
        
        const boxWidth = 80, boxHeight = 20;
        const boxX = chart.chartArea.left - 5;
        const boxY = strikeY - boxHeight / 2;
        
        ctx.beginPath();
        ctx.moveTo(boxX + 4, boxY);
        ctx.lineTo(boxX + boxWidth - 4, boxY);
        ctx.lineTo(boxX + boxWidth, boxY + 4);
        ctx.lineTo(boxX + boxWidth, boxY + boxHeight - 4);
        ctx.lineTo(boxX + boxWidth - 4, boxY + boxHeight);
        ctx.lineTo(boxX + 4, boxY + boxHeight);
        ctx.lineTo(boxX, boxY + boxHeight - 4);
        ctx.lineTo(boxX, boxY + 4);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        
        ctx.font = 'bold 11px Arial';
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$' + manualBeatPrice.toFixed(2), boxX + boxWidth / 2, boxY + boxHeight / 2);
        
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(249, 115, 22, 0.25)';
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, 2 * Math.PI);
        ctx.fillStyle = '#f97316';
        ctx.fill();
      }
    };

    async function init() {
      btcPrice = await fetchPrice();
      manualBeatPrice = btcPrice;
      prevPrice = btcPrice;
      
      document.getElementById('cycleLabel').textContent = '60:00 remaining';
      document.getElementById('strike').textContent = '$' + manualBeatPrice.toFixed(2);
      document.getElementById('titlePrice').textContent = 'BTC $' + btcPrice.toFixed(2);
      
      rawPrices.length = 0;
      maPrices.length = 0;
      for (let i = 0; i < dataPoints; i++) {
        rawPrices.push(btcPrice);
        maPrices.push(btcPrice);
      }
      
      const chart = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: {
          labels: Array(dataPoints).fill(''),
          datasets: [{
            data: maPrices,
            borderColor: '#22c55e',
            backgroundColor: 'rgba(34,197,94,0.1)',
            fill: true,
            tension: 0.8,
            borderWidth: 2,
            pointRadius: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { display: false },
            y: { 
              position: 'right',
              min: manualBeatPrice - 100,
              max: manualBeatPrice + 100,
              grid: { color: 'rgba(255,255,255,0.05)' },
              ticks: { color: '#64748b', callback: v => '$' + Math.round(v) }
            }
          }
        },
        plugins: [dotPlugin]
      });

      let lastRemaining = 0;

      function updateTime() {
        const { remaining, now } = getCycleInfo();
        
        if (remaining > lastRemaining || remaining === cycleDuration - 1) {
          manualBeatPrice = btcPrice;
          document.getElementById('cycleLabel').textContent = '60:00 remaining';
          document.getElementById('strike').textContent = '$' + manualBeatPrice.toFixed(2);
          for (let i = 0; i < dataPoints; i++) {
            rawPrices[i] = btcPrice;
            maPrices[i] = btcPrice;
          }
        }
        lastRemaining = remaining;
        
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        const timeStr = mins.toString().padStart(2,'0') + ':' + secs.toString().padStart(2,'0');
        document.getElementById('countdown').textContent = timeStr;
        document.getElementById('cycleLabel').textContent = timeStr + ' remaining';
        
        const h = now.getHours().toString().padStart(2,'0');
        const m = now.getMinutes().toString().padStart(2,'0');
        const s = now.getSeconds();
        const html = [];
        for (let i = 5; i >= 0; i--) {
          let sec = s - (i * 5);
          let min = now.getMinutes();
          if (sec < 0) { sec += 60; min -= 1; }
          let label = h + ':' + min.toString().padStart(2,'0') + ':' + sec.toString().padStart(2,'0');
          html.push(`<span class="${i === 0 ? 'text-green-400 font-bold' : ''}">${label}</span>`);
        }
        document.getElementById('timeAxis').innerHTML = html.join('');
      }

    let currentRange = 100;

      async function update() {
        const newPrice = await fetchPrice();
        const variation = (Math.random() - 0.5) * (manualBeatPrice * 0.002);
        btcPrice = newPrice + variation;
        prevPrice = btcPrice;
        
        rawPrices.shift();
        rawPrices.push(btcPrice);
        
        const ma = calculateMA(rawPrices, maPeriod);
        maPrices.shift();
        maPrices.push(ma);
        
        // Dynamic spread
        const priceDistance = Math.abs(btcPrice - manualBeatPrice);
        const threshold = currentRange * 0.65;
        
        if (priceDistance > threshold) {
          currentRange += (priceDistance - threshold) * 0.1;
        } else if (currentRange > 100 && priceDistance < threshold * 0.5) {
          currentRange -= 0.5;
          if (currentRange < 100) currentRange = 100;
        }
        
        chart.options.scales.y.min = manualBeatPrice - currentRange;
        chart.options.scales.y.max = manualBeatPrice + currentRange;
        
        const currentMA = maPrices[maPrices.length - 1];
        const lineColor = currentMA >= manualBeatPrice ? '#22c55e' : '#ef4444';
        chart.data.datasets[0].borderColor = lineColor;
        chart.data.datasets[0].backgroundColor = lineColor + '1A';
        
        document.getElementById('titlePrice').textContent = 'BTC $' + btcPrice.toFixed(2);
        
        chart.update('none');
        updateTime();
      }

      updateTime();
      update();
      setInterval(update, 200);
    }

    init();
  </script>
</body>
</html>
